# Copy Desk: follow the smart money, on a trend-following base.
#
# 40% of the money copies people who have to publish their trades:
#   - Insider Tracker: company officers and directors buying their own stock
#     on the open market (SEC Form 4, public within 2 business days). Strongest
#     when several insiders, or the CEO/CFO, buy together.
#   - Fund Tracker: what Berkshire, Pershing Square, Appaloosa, Baupost and
#     Duquesne own and added last quarter (SEC 13F, up to 4.5 months old).
#   - Capitol Tracker: stock buys disclosed by members of Congress (free Bargo
#     feed, last 3 months only; counted at half weight, the evidence is mixed).
#   - Hype Watch: asks Grok to search X for pump chatter. It can only vote
#     AGAINST a stock, never for it; social-media "top traders" are a warning
#     sign, not a tip. Sits out without an xAI key.
# Each tracker abstains when there is nothing to copy, and a stock nobody is
# buying keeps its slot in cash. Everything is read by the day it was filed,
# never the day the trade happened, so backtests can't peek.
#
# 60% runs the Momentum Leaders signals (momentum x2, trend, low volatility).
# The market filter and pump guard cover the whole fund.
#
# Suggested stocks to watch (12, a mix of the funds' holdings and large caps):
#   AAPL, AXP, BAC, KO, OXY, CMG, GOOGL, AMZN, UBER, HLT, NVDA, MSFT
#
# Needs: your name and email for the SEC (free). Optional: a free Bargo key,
# an xAI key for Hype Watch (a few cents per stock per day).
# Rebalances weekly so a fresh insider buy is acted on within days.
schema_version: 2
name: copy-desk
strategies:
  - name: smart-money
    display_name: Smart Money
    weight: 0.4
    blend: {mode: long_only, method: slot_weighted}
    models:
      - name: insiders
      - name: superinvestors
      - name: congress
        weight: 0.5
      - name: social_watch
  - name: leaders
    display_name: Momentum Leaders
    weight: 0.6
    blend: {mode: long_only}
    models:
      - name: momentum
        weight: 2
      - name: trend
      - name: low_vol
risk:
  max_position_pct: 0.12
  max_gross_exposure: 1.0
  market_filter: {ma_days: 200, risk_off_gross: 0.3}
  pump_guard: {jump_1d: 0.25, jump_5d: 0.40, volume_multiple: 4.0, cooldown_days: 10}
capital: 100000
rebalance: weekly
benchmark: SPY
