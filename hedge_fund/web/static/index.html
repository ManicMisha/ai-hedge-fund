<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hedge Fund Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a game HUD around a playfield. Save-file select first, then one fund
   as a party screen: stats bar, quest map + inventory, the party, the log, and
   a sticky action bar. One deliberate night-arcade world (single theme). */
:root {
  color-scheme: dark;
  --void: #0f0c1d;
  --panel: #1a1530;
  --panel-2: #241d42;
  --edge: #3b3066;
  --ink: #f3eeff;
  --muted: #a49bcb;
  --faint: #6e6596;
  --gold: #ffc93c;
  --gold-deep: #c78f00;
  --hp: #47e08f;
  --dmg: #ff5a76;
  --mana: #5cc8ff;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --px: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink);
  font: 14px/1.5 var(--body);
  background-image:
    radial-gradient(circle at 20% -10%, rgba(92, 200, 255, .08), transparent 40%),
    radial-gradient(circle at 90% 0%, rgba(255, 201, 60, .06), transparent 35%);
  background-attachment: fixed;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 120px; }
h1, h2, h3, .disp { font-family: var(--display); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.label { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.up { color: var(--hp); } .down { color: var(--dmg); } .flat { color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); }

/* pixel frames: a chunky border with notched corners */
.frame {
  background: var(--panel); border: var(--px) solid var(--edge); padding: 16px;
  clip-path: polygon(var(--px) 0, calc(100% - var(--px)) 0, calc(100% - var(--px)) var(--px), 100% var(--px),
    100% calc(100% - var(--px)), calc(100% - var(--px)) calc(100% - var(--px)), calc(100% - var(--px)) 100%,
    var(--px) 100%, var(--px) calc(100% - var(--px)), 0 calc(100% - var(--px)), 0 var(--px), var(--px) var(--px));
  min-width: 0;
}
.frame > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

/* buttons */
.btn {
  --c: var(--panel-2); --t: var(--ink); --s: #120e24;
  background: var(--c); color: var(--t); border: 0; cursor: pointer;
  font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
  padding: 10px 16px 12px; box-shadow: inset 0 calc(-1 * var(--px)) 0 var(--s), 0 0 0 var(--px) var(--edge);
  transition: transform .06s, filter .12s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--s), 0 0 0 var(--px) var(--edge); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.gold { --c: var(--gold); --t: #2a1c00; --s: var(--gold-deep); }
.btn.red { --c: #8c2338; --t: #ffe3e8; --s: #4f101f; }
.btn.green { --c: #1f7a4c; --t: #e3ffef; --s: #0f4128; }
.btn.ghost { --c: transparent; --s: transparent; box-shadow: 0 0 0 2px var(--edge); }
.btn.small { font-size: 12px; padding: 6px 10px 8px; }
.btn:focus-visible, .slot:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--mana); outline-offset: 3px;
}
.pill { font-family: var(--display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 2px solid currentColor; white-space: nowrap; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { width: 40px; height: 40px; image-rendering: pixelated; }
.brand h1 { font-size: 26px; line-height: 1; }
.brand h1 span { color: var(--gold); }
.brand .sub { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-family: var(--display); }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-banner { background: repeating-linear-gradient(-45deg, #3a2a00 0 10px, #2c2000 10px 20px); color: var(--gold); text-align: center; padding: 8px 16px; font-family: var(--display); letter-spacing: .1em; font-size: 13px; }

/* insert-coin banner */
.coin { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; margin-bottom: 18px; border-color: var(--gold-deep); }
.coin .big { font-size: 22px; color: var(--gold); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* save slots */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.slot { text-align: left; cursor: pointer; display: grid; gap: 10px; color: inherit; font: inherit; }
.slot:hover { background: var(--panel-2); }
.slot .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slot h3 { font-size: 22px; overflow-wrap: anywhere; }
.slot .meta { font-size: 12px; color: var(--muted); }
.slot.new { place-items: center; text-align: center; min-height: 190px; border-style: dashed; color: var(--gold); }
.slot.new .plus { font-family: var(--display); font-size: 44px; line-height: 1; }

/* bars */
.bar { height: 14px; background: #0c0918; border: 2px solid var(--edge); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--hp);
  background-image: repeating-linear-gradient(90deg, transparent 0 10px, rgba(0,0,0,.28) 10px 12px); }
.bar > i.bad { background-color: var(--dmg); }
.bar > i.boss { background-color: var(--mana); }
.bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .7; }

/* fund HUD */
.hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.hud h2 { font-size: 30px; overflow-wrap: anywhere; }
.lv { font-family: var(--display); background: var(--gold); color: #2a1c00; padding: 2px 8px; font-size: 14px; font-weight: 700; }
.stats { display: grid; grid-template-columns: 1.3fr 1fr 1fr .9fr; gap: 18px; margin-bottom: 18px; }
.stat .value { font-size: 34px; line-height: 1.05; margin: 6px 0 8px; }
.stat .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.chart-box { position: relative; height: 280px; }
.chart-box canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: 6px; }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }

/* inventory */
.inv { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px; background: #140f27; border: 2px solid var(--edge); }
.item .tk { font-family: var(--display); font-size: 16px; font-weight: 700; background: var(--panel-2); text-align: center; padding: 6px 0; color: var(--mana); }
.item .tk.cash { color: var(--gold); }
.item .sub { font-size: 12px; color: var(--muted); }
.item .val { text-align: right; }
.mini { height: 6px; background: #0c0918; margin-top: 4px; }
.mini > i { display: block; height: 100%; background: var(--mana); }

/* party */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; border: 2px solid var(--edge); color: var(--muted); cursor: pointer; padding: 4px 12px; font-family: var(--display); font-size: 15px; letter-spacing: .06em; }
.tab[aria-selected="true"] { background: var(--mana); border-color: var(--mana); color: #04131c; }
.squad { margin-top: 14px; }
.squad > .label { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.hero { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; background: #140f27; border: 2px solid var(--edge); padding: 12px; min-width: 0; }
.hero img { width: 64px; height: 64px; image-rendering: pixelated; background: #0c0918; border: 2px solid var(--edge); }
.hero .who { font-family: var(--display); font-size: 17px; font-weight: 600; line-height: 1.15; }
.hero .cls { font-size: 11px; color: var(--muted); }
.hero .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.power { display: flex; gap: 2px; }
.power i { width: 8px; height: 12px; background: #2b2450; }
.power i.on { background: var(--gold); }
.bubble { grid-column: 1 / -1; position: relative; background: var(--ink); color: #1a1530; padding: 10px 12px; font-size: 13px; line-height: 1.45; margin-top: 4px; overflow-wrap: anywhere; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 24px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
.bubble.quiet { background: #2b2450; color: var(--muted); }
.bubble.quiet::before { border-bottom-color: #2b2450; }
.stance-bullish { color: var(--hp); } .stance-bearish { color: var(--dmg); } .stance-neutral { color: var(--muted); } .stance-abstain { color: var(--faint); }

/* next move */
.targets { display: grid; gap: 10px; }
.target { display: grid; grid-template-columns: 56px 1fr 60px; gap: 10px; align-items: center; }
.target .tk { font-family: var(--display); color: var(--mana); font-weight: 700; }
.split { height: 12px; background: #0c0918; position: relative; border: 2px solid var(--edge); }
.split::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--faint); }
.split > i { position: absolute; top: 0; bottom: 0; background: var(--hp); }
.split > i.short { background: var(--dmg); }
.trim { font-size: 12px; color: var(--gold); margin-top: 10px; }

/* log */
.log { display: grid; gap: 0; max-height: 420px; overflow: auto; }
.entry { display: grid; grid-template-columns: 96px 72px 1fr; gap: 12px; padding: 8px 4px; border-bottom: 2px dashed #2b2450; align-items: baseline; font-size: 13px; }
.entry .when { color: var(--faint); font-variant-numeric: tabular-nums; }
.tag { font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 1px 4px; }
.tag.buy { background: var(--hp); color: #052814; } .tag.sell { background: var(--dmg); color: #2c0610; }
.tag.risk { background: var(--gold); color: #2a1c00; } .tag.plan { background: var(--mana); color: #04131c; }
.tag.halt, .tag.tick_failed { background: #8c2338; color: #ffe3e8; } .tag.resume { background: #1f7a4c; color: #e3ffef; } .tag.redo { background: var(--edge); color: var(--ink); }

/* action bar */
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(15, 12, 29, .94); border-top: var(--px) solid var(--edge);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(6px); }
.actions .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.actions .status { margin-right: auto; font-size: 12px; color: var(--muted); min-width: 0; }
.actions .status b { color: var(--ink); font-weight: 500; }

/* modal */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(6, 4, 14, .78); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.modal h3 { font-size: 24px; margin-bottom: 6px; }
.modal .foot { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.field { display: grid; gap: 6px; margin-top: 14px; }
.field input, .field select { background: #0c0918; border: 2px solid var(--edge); padding: 10px 12px; width: 100%; }
.field .hint { font-size: 12px; color: var(--muted); }
.ok { color: var(--hp); } .warn { color: var(--gold); }
.plan-list { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 8px; }
.error { background: #3a1020; border: 2px solid var(--dmg); color: #ffd6de; padding: 10px 12px; margin-top: 12px; font-size: 13px; overflow-wrap: anywhere; }

/* thinking overlay */
.thinking { text-align: center; }
.thinking .sprites { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
.thinking .sprites img { width: 48px; height: 48px; image-rendering: pixelated; animation: hop .9s steps(2) infinite; }
.thinking .sprites img:nth-child(2) { animation-delay: .15s; } .thinking .sprites img:nth-child(3) { animation-delay: .3s; }
.thinking .sprites img:nth-child(4) { animation-delay: .45s; } .thinking .sprites img:nth-child(5) { animation-delay: .6s; }
@keyframes hop { 50% { transform: translateY(-8px); } }

.toast { position: fixed; z-index: 30; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: calc(100% - 32px); }
.toast .frame { padding: 10px 16px; border-color: var(--gold-deep); }

/* xp + levels */
.xp { display: flex; align-items: center; gap: 12px; margin: -6px 0 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.xp .bar { flex: 1 1 200px; max-width: 420px; height: 12px; }
.xp .bar > i { background-color: var(--gold); transition: width .8s steps(12); }
.rank { font-family: var(--display); color: var(--gold); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.slot .xpline { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.slot .xpline .bar { flex: 1; height: 8px; border-width: 1px; }
.slot .xpline .bar > i { background-color: var(--gold); }

/* high scores */
.board { margin-bottom: 22px; }
.board .title { font-size: 22px; color: var(--gold); text-shadow: 3px 3px 0 #5a3d00; }
.board table { width: 100%; border-collapse: collapse; font-size: 13px; }
.board th { text-align: left; font-family: var(--display); font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--edge); white-space: nowrap; }
.board td { padding: 10px 8px; border-bottom: 2px dashed #2b2450; vertical-align: middle; }
.board tr[data-open] { cursor: pointer; }
.board tr[data-open]:hover td, .board tr[data-open]:focus-visible td { background: var(--panel-2); }
.board tr[data-open]:focus-visible { outline: 3px solid var(--mana); outline-offset: -3px; }
.board .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.board .fund { font-family: var(--display); font-size: 16px; overflow-wrap: break-word; }
.board .who { font-size: 11px; color: var(--muted); }
.place { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.place.p1 { color: var(--gold); } .place.p2 { color: #dcdcef; } .place.p3 { color: #e0915a; }
.place.p1::after { content: " ♛"; animation: blink 1.6s steps(2) infinite; }
.early { font-family: var(--display); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--faint); padding: 0 4px; margin-left: 6px; white-space: nowrap; }
.board .foot-note { font-size: 12px; color: var(--faint); margin: 10px 0 0; }

/* trophy room */
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.trophy { background: #140f27; border: 2px solid var(--edge); padding: 10px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; min-width: 0; }
.trophy img { width: 44px; height: 44px; image-rendering: pixelated; }
.trophy.got { border-color: var(--gold-deep); background: linear-gradient(180deg, rgba(255, 201, 60, .08), transparent 60%), #140f27; }
.trophy.locked img { filter: grayscale(1) brightness(.45); }
.trophy.locked .nm { color: var(--muted); }
.trophy .nm { font-family: var(--display); font-size: 15px; line-height: 1.15; }
.trophy .ds { font-size: 11px; color: var(--muted); line-height: 1.35; }
.trophy .when { font-size: 11px; color: var(--gold); }
.trophy .mini { margin-top: 5px; } .trophy .mini > i { background: var(--gold); }

/* game feel */
.hero img { animation: bob 2.4s steps(2) infinite; }
.hero:nth-child(3n+2) img { animation-delay: .8s; } .hero:nth-child(3n) img { animation-delay: 1.6s; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.hero.hot img { box-shadow: 0 0 0 2px var(--hp), 0 0 14px rgba(71, 224, 143, .45); }
.hero.cold img { box-shadow: 0 0 0 2px var(--dmg); }
.entry.fresh { animation: flash 1.8s steps(9) 2; }
@keyframes flash { from { background: rgba(255, 201, 60, .32); } to { background: transparent; } }
.shake { animation: shake .45s steps(6); }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, -2px); } 80% { transform: translate(3px, 2px); } }
.floater { position: fixed; z-index: 41; pointer-events: none; font-family: var(--display); font-size: 28px; font-weight: 700; text-shadow: 3px 3px 0 #000; animation: rise 1.6s ease-out forwards; }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -70px); opacity: 0; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
.celebrate { text-align: center; }
.celebrate .kicker { font-family: var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--mana); font-size: 13px; }
.celebrate .big { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1.05; color: var(--gold); text-shadow: 4px 4px 0 #6b3d00; margin: 6px 0 4px; animation: pop .55s steps(6); }
.celebrate img { width: 112px; height: 112px; image-rendering: pixelated; margin: 12px auto 6px; display: block; animation: pop .55s steps(6); }
@keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
.celebrate .foot { justify-content: center; align-items: center; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .14) 0 1px, transparent 1px 3px); opacity: .5; }

/* alerts */
.count { display: inline-block; min-width: 18px; padding: 0 4px; margin-left: 4px; background: var(--dmg); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.feed { display: grid; gap: 8px; max-height: 46vh; overflow: auto; margin-top: 12px; }
.alert { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 10px; background: #140f27; border: 2px solid var(--edge); border-left-width: 6px; }
.alert.good { border-left-color: var(--hp); } .alert.warn { border-left-color: var(--gold); } .alert.bad { border-left-color: var(--dmg); } .alert.info { border-left-color: var(--mana); }
.alert.new { background: linear-gradient(90deg, rgba(255, 201, 60, .1), transparent 50%), #140f27; }
.alert .when { font-size: 11px; color: var(--faint); }
.alert .kind { font-family: var(--display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.alert .t { font-family: var(--display); font-size: 15px; line-height: 1.2; }
.alert .b { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 13px; }
.checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.checks input, .switch input { accent-color: var(--gold); width: 16px; height: 16px; }
.sub-h { font-family: var(--display); font-size: 16px; margin: 18px 0 2px; }
code.cmd { display: block; background: #0c0918; border: 2px solid var(--edge); padding: 10px 12px; font-size: 12px; overflow-wrap: anywhere; user-select: all; margin: 8px 0; }

/* auto-play strip */
.autoplay { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; margin-bottom: 22px; }
.autoplay .state { font-family: var(--display); font-size: 20px; letter-spacing: .08em; }
.autoplay .state.on { color: var(--hp); } .autoplay .state.off { color: var(--faint); }
.autoplay .state.on::before { content: "● "; animation: blink 1.4s steps(2) infinite; }
.autoplay .info { font-size: 12px; color: var(--muted); min-width: 0; }
.autoplay .info b { color: var(--ink); font-weight: 500; }
.autoplay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* go-live check */
.golive header .score { font-family: var(--display); font-size: 22px; }
.golive .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.check { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px; background: #140f27; border: 2px solid var(--edge); }
.check .mark { font-family: var(--display); font-size: 20px; line-height: 1; }
.check.ok { border-color: #1f7a4c; } .check.ok .mark { color: var(--hp); }

.runs table { width: 100%; border-collapse: collapse; font-size: 13px; }
.runs th { text-align: left; font-family: var(--display); font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--edge); white-space: nowrap; }

@media (max-width: 960px) { .lab { grid-template-columns: minmax(0, 1fr); } }

  .hud h2 { font-size: 24px; }

<body>
<div id="demo"></div>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="actions"></div>
<div id="layer"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
"use strict";
/* ------------------------------------------------------------------ basics */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v, cents = false) => v == null ? "–" : (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const cls = (v) => v == null ? "flat" : v > 0.00005 ? "up" : v < -0.00005 ? "down" : "flat";
const day = (s) => { if (!s) return "–"; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return `${d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1]} ${y}`; };

const S = { demo: false, app: null, fund: null, ticker: null, poll: null };

async function api(path, body) {
  if (S.demo) return demoApi(path, body);
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-AIHF": "1" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* ------------------------------------------------------------ pixel sprites */
const spriteCache = {};
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function sprite(id, kind) {
  const key = id + kind;
  if (spriteCache[key]) return spriteCache[key];
  const n = 10, c = document.createElement("canvas"); c.width = c.height = n;
  const g = c.getContext("2d");
  let h = hash(id);
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const palettes = kind === "quant"
    ? [["#5cc8ff", "#1d6f9c"], ["#7af0ff", "#2a7f8f"]]
    : kind === "tracker" ? [["#c7f464", "#5d7a1c"], ["#e8e8e8", "#6b6b6b"]]
    : [["#ffc93c", "#b3741c"], ["#ff8fb1", "#a3355a"], ["#9b8cff", "#4f3fb0"], ["#47e08f", "#1f7a4c"], ["#ffa65c", "#a5531c"]];
  const [main, dark] = palettes[Math.floor(rnd() * palettes.length)];
  // face: a mirrored 10x10 creature with eyes on row 4
  for (let y = 1; y < 9; y++) for (let x = 0; x < 5; x++) {
    const edge = y === 1 || y === 8 || x === 0;
    const on = rnd() > (edge ? 0.62 : 0.28);
    if (!on) continue;
    g.fillStyle = (y > 6 || x === 0) ? dark : main;
    g.fillRect(x + 0, y, 1, 1); g.fillRect(n - 1 - x, y, 1, 1);
  }
  g.fillStyle = main; g.fillRect(3, 3, 4, 4); g.fillRect(2, 4, 6, 3);
  g.fillStyle = "#0f0c1d"; g.fillRect(3, 4, 1, 2); g.fillRect(6, 4, 1, 2);
  g.fillStyle = "#ffffff"; g.fillRect(3, 4, 1, 1); g.fillRect(6, 4, 1, 1);
  g.fillStyle = dark; g.fillRect(4, 6, 2, 1);
  return (spriteCache[key] = c.toDataURL());
}

/* ------------------------------------------------------------------ sound */
// Chiptune blips from the Web Audio API: no files, nothing downloaded.
const SFX = (() => {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem("aihf-muted") === "1"; } catch { /* storage blocked: default on */ }
  const wake = () => {
    if (muted) return null;
    try { ctx ||= new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch { return null; }
    return ctx;
  };
  const play = (notes, type = "square", vol = 0.045) => {
    const c = wake(); if (!c) return;
    const t0 = c.currentTime + 0.01;
    for (const [freq, at, dur] of notes) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0 + at);
      g.gain.setValueAtTime(vol, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
      o.connect(g).connect(c.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
    }
  };
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("aihf-muted", muted ? "1" : "0"); } catch { /* fine */ } if (!muted) this.coin(); },
    wake,
    click: () => play([[660, 0, 0.04]], "square", 0.025),
    coin: () => play([[988, 0, 0.08], [1319, 0.08, 0.28]]),
    loss: () => play([[392, 0, 0.12], [311, 0.12, 0.12], [233, 0.24, 0.3]], "triangle", 0.07),
    buy: (i = 0) => play([[523 + i * 40, 0, 0.05], [784 + i * 40, 0.05, 0.08]], "square", 0.03),
    sell: (i = 0) => play([[784 - i * 30, 0, 0.05], [523 - i * 30, 0.05, 0.08]], "square", 0.03),
    unlock: () => play([[523, 0, 0.1], [659, 0.1, 0.1], [784, 0.2, 0.1], [1047, 0.3, 0.45]]),
    levelUp: () => play([[392, 0, 0.09], [523, 0.09, 0.09], [659, 0.18, 0.09], [784, 0.27, 0.09], [1047, 0.36, 0.09], [1319, 0.45, 0.6]]),
    error: () => play([[180, 0, 0.18], [150, 0.18, 0.3]], "sawtooth", 0.035),
  };
})();
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------- badge icons */
// 8x8 pixel art: "#" main colour, "o" detail colour.
const ICONS = {
  bell:     ["#ffc93c", "#b3741c", ["...##...", "..####..", ".######.", ".######.", ".######.", "########", "...oo...", "........"]],
  coin:     ["#ffc93c", "#b3741c", ["..####..", ".######.", "###oo###", "###o####", "####o###", "###oo###", ".######.", "..####.."]],
  calendar: ["#f3eeff", "#ff5a76", [".o....o.", "oooooooo", "oooooooo", "########", "#.#.#.##", "########", "#.#.#.##", "########"]],
  star:     ["#ffc93c", "#fff4c2", ["...##...", "...##...", "###oo###", ".######.", "..####..", ".##..##.", ".#....#.", "........"]],
  sword:    ["#dcdcef", "#ffc93c", ["......##", ".....###", "....###.", "o..###..", ".o###...", "..oo....", ".o.oo...", "o...o..."]],
  crown:    ["#ffc93c", "#ff5a76", ["........", "#..##..#", "##.##.##", "########", "#o##o##o", "########", "........", "........"]],
  shield:   ["#5cc8ff", "#1d6f9c", ["########", "#oooooo#", "#o####o#", "#o####o#", ".#o##o#.", ".#o##o#.", "..#oo#..", "...##..."]],
  flame:    ["#ff7a3c", "#ffc93c", ["...#....", "...##...", "..###...", "..####..", ".##o###.", ".#ooo##.", ".#ooo#..", "..###..."]],
  gem:      ["#ff8fb1", "#a3355a", ["........", ".######.", "##o##o##", "########", ".######.", "..####..", "...##...", "........"]],
  trophy:   ["#ffc93c", "#b3741c", ["########", "#o####o#", "#o####o#", ".######.", "..####..", "...oo...", "..####..", ".######."]],
  heart:    ["#ff5a76", "#ffd6de", ["........", ".##..##.", "#o######", "########", ".######.", "..####..", "...##...", "........"]],
  alarm:    ["#ff5a76", "#ffd6de", ["...##...", "..####..", ".##oo##.", ".##oo##.", ".######.", "########", "########", "........"]],
  eye:      ["#47e08f", "#0f0c1d", ["........", "..####..", ".######.", "###oo###", "###oo###", ".######.", "..####..", "........"]],
  snow:     ["#bfefff", "#5cc8ff", ["#..#..#.", ".#.#.#..", "..ooo...", "###o###.", "..ooo...", ".#.#.#..", "#..#..#.", "........"]],
};
const iconCache = {};
function icon(name) {
  if (iconCache[name]) return iconCache[name];
  const [main, detail, rows] = ICONS[name] || ICONS.star;
  const c = document.createElement("canvas"); c.width = c.height = 10;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(x + 2, y + 2, 1, 1); // drop shadow
    g.fillStyle = ch === "o" ? detail : main; g.fillRect(x + 1, y + 1, 1, 1);
  }));
  return (iconCache[name] = c.toDataURL());
}

/* ----------------------------------------------------------------- effects */
function burst(colors = ["#ffc93c", "#47e08f", "#5cc8ff", "#ff8fb1", "#f3eeff"], count = 90) {
  if (reducedMotion()) return;
  const cv = $("#fx"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ox = innerWidth / 2, oy = innerHeight * 0.42;
  const bits = Array.from({ length: count }, () => {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, s: 4 + Math.floor(Math.random() * 3) * 2, c: colors[Math.floor(Math.random() * colors.length)] };
  });
  const start = performance.now();
  (function frame(now) {
    const t = now - start; g.clearRect(0, 0, innerWidth, innerHeight);
    if (t > 1600) return;
    g.globalAlpha = Math.max(0, 1 - t / 1600);
    for (const b of bits) { b.vy += 0.32; b.x += b.vx; b.y += b.vy; g.fillStyle = b.c; g.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s); }
    requestAnimationFrame(frame);
  })(start);
}
function floater(text, el, good) {
  if (!el) return;
  const box = el.getBoundingClientRect(), f = document.createElement("div");
  f.className = "floater"; f.textContent = text; f.style.color = good ? "var(--hp)" : "var(--dmg)";
  f.style.left = `${box.left + box.width / 2}px`; f.style.top = `${Math.max(8, box.top + 10)}px`;
  document.body.appendChild(f); setTimeout(() => f.remove(), 1700);
}
function countUp(el, from, to, ms = 900) {
  if (!el) return;
  if (reducedMotion() || from === to) { el.textContent = money(to); return; }
  const start = performance.now();
  (function frame(now) {
    const k = Math.min(1, (now - start) / ms), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = money(from + (to - from) * eased);
    if (k < 1) requestAnimationFrame(frame);
  })(start);
}
function shake(el) { if (!el || reducedMotion()) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

/* ------------------------------------------------------- level-ups & badges */
// What this browser has already celebrated, per fund. First visit: remember
// silently, so opening an old fund doesn't fire twenty fanfares.
function seenKey(name) { return `aihf-seen:${name}`; }
function loadSeen(name) { try { return JSON.parse(localStorage.getItem(seenKey(name)) || "null"); } catch { return null; } }
function saveSeen(name, g) { try { localStorage.setItem(seenKey(name), JSON.stringify({ level: g.level, badges: g.badges.filter((b) => b.unlocked).map((b) => b.id) })); } catch { /* fine */ } }
function celebrate(f) {
  const g = f.game; if (!g || S.demo) return;
  const seen = loadSeen(f.name);
  saveSeen(f.name, g);
  if (!seen) return;
  const queue = [];
  if (g.level > (seen.level || 1)) queue.push({ kind: "level", from: seen.level || 1, to: g.level, rank: g.rank });
  for (const b of g.badges) if (b.unlocked && !(seen.badges || []).includes(b.id)) queue.push({ kind: "badge", badge: b });
  S.cheers = queue; nextCheer();
}
function nextCheer() {
  const c = (S.cheers || []).shift();
  if (!c) return;
  const more = S.cheers.length ? `<span class="faint" style="font-size:12px">${S.cheers.length} more</span>` : "";
  if (c.kind === "level") {
    modal(`<div class="celebrate"><div class="kicker">${esc(S.fund?.name || "")}</div><div class="big">LEVEL UP!</div>
      <div class="num" style="font-size:22px">LV ${c.from} → <span style="color:var(--gold)">LV ${c.to}</span></div>
      <p class="rank" style="margin:8px 0 0">${esc(c.rank)}</p>
      <div class="foot">${more}<button class="btn gold" data-act="cheer">Nice!</button></div></div>`);
    SFX.levelUp(); burst();
  } else {
    const b = c.badge;
    modal(`<div class="celebrate"><div class="kicker">Achievement unlocked</div><img alt="" src="${icon(b.icon)}">
      <div class="big" style="font-size:32px">${esc(b.name)}</div><p class="muted" style="margin:6px 0 0">${esc(b.desc)}</p>
      <p class="faint" style="font-size:12px">+25 XP${b.at ? ` · ${day(b.at)}` : ""}</p>
      <div class="foot">${more}<button class="btn gold" data-act="cheer">Nice!</button></div></div>`);
    SFX.unlock(); burst(["#ffc93c", "#fff4c2", "#ffa65c"], 60);
  }
}

/* ------------------------------------------------------------------ alerts */
const KIND_LABELS = { insider: "Insider buying", fund_buy: "Famous fund buying", congress: "Congress buying", hype: "Hype warning",
  pump: "Pump alarm", shield: "Market shield", big_day: "Big days (±3%)", drawdown: "Drawdowns", frozen: "Fund froze", golive: "Go-live passed" };
function loadSeenAlerts() { try { return JSON.parse(localStorage.getItem("aihf-alerts-seen") || "null"); } catch { return null; } }
function saveSeenAlerts(ids) { try { localStorage.setItem("aihf-alerts-seen", JSON.stringify(ids.slice(0, 300))); } catch { /* fine */ } }
function unreadAlerts() {
  const list = S.alerts?.alerts || [], seen = new Set(S.seenAlerts || []);
  return list.filter((a) => !seen.has(a.id));
}
async function pollAlerts() {
  let data; try { data = await api("/api/alerts"); } catch { return; }
  const first = S.alerts == null;
  const known = new Set((S.alerts?.alerts || []).map((a) => a.id));
  S.alerts = data;
  if (S.seenAlerts == null) {
    S.seenAlerts = loadSeenAlerts();
    if (S.seenAlerts == null) { S.seenAlerts = data.alerts.map((a) => a.id); saveSeenAlerts(S.seenAlerts); } // first visit: no flood
  }
  if (!first) {
    const fresh = data.alerts.filter((a) => !known.has(a.id) && !(S.seenAlerts || []).includes(a.id));
    fresh.slice(0, 3).forEach((a, i) => setTimeout(() => {
      toast(`${a.title}`);
      if (a.level === "bad") SFX.error(); else SFX.coin();
      try { if ("Notification" in window && Notification.permission === "granted") new Notification(a.title, { body: a.body, tag: a.id }); } catch { /* fine */ }
    }, i * 1600));
  }
  const bell = $("#bell"); if (bell) bell.outerHTML = bellButton();
}
function bellButton() {
  const n = S.alerts ? unreadAlerts().length : 0;
  return `<button id="bell" class="btn small ghost" data-act="alerts" aria-label="Alerts${n ? `, ${n} new` : ""}">Alerts${n ? `<span class="count">${n > 99 ? "99+" : n}</span>` : ""}</button>`;
}
function alertRow(a, fresh) {
  return `<div class="alert ${esc(a.level)} ${fresh ? "new" : ""}"><div><div class="kind">${esc(a.label)}</div><div class="when">${day(a.session)}</div></div>
    <div style="min-width:0"><div class="t">${esc(a.title)}</div><div class="b">${esc(a.fund)} · ${esc(a.body)}</div></div></div>`;
}
function alertsModal(error = "", note = "") {
  const d = S.alerts || { alerts: [], settings: { phone: false, kinds: Object.keys(KIND_LABELS) }, phone_ready: false };
  const unread = new Set(unreadAlerts().map((a) => a.id));
  S.seenAlerts = [...new Set([...d.alerts.map((a) => a.id), ...(S.seenAlerts || [])])]; saveSeenAlerts(S.seenAlerts);
  const desk = !("Notification" in window) ? "Not supported in this browser" : Notification.permission === "granted" ? "On while this tab is open" : Notification.permission === "denied" ? "Blocked in your browser settings" : "";
  modal(`<h3>Alerts</h3><p class="muted" style="margin:0">Pings when something changes: insiders or a famous fund buying, a pump alarm, the market shield, a big day, a fund freezing.</p>
    <div class="feed">${d.alerts.length ? d.alerts.slice(0, 60).map((a) => alertRow(a, unread.has(a.id))).join("") : `<div class="empty">No alerts yet. They appear as your funds play days.</div>`}</div>
    <div class="sub-h">Phone alerts</div>
    <p class="muted" style="margin:0;font-size:12px">Free, through the ntfy app (iPhone or Android): install it, tap <b>+</b>, and subscribe to the topic below. Anyone who knows the topic can read your alerts, so keep the random one.</p>
    <form id="alerts-form">
      <div class="field"><label class="label" for="ntfy">Topic</label>
        <input id="ntfy" autocomplete="off" spellcheck="false" placeholder="${d.phone_ready ? "Saved ✓ (type to replace)" : ""}" value="${d.phone_ready ? "" : esc(randomTopic())}">
        <span class="hint ${d.phone_ready ? "ok" : ""}">${d.phone_ready ? "Saved. Your phone gets alerts while auto-play or Play runs." : "Subscribe to this exact name in the ntfy app, then Save."}</span></div>
      <label class="switch" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="phone-on" ${d.settings.phone ? "checked" : ""}> Send alerts to my phone</label>
      <div class="sub-h" style="font-size:14px">Which alerts</div>
      <div class="checks">${Object.entries(KIND_LABELS).map(([k, label]) => `<label><input type="checkbox" name="kind" value="${k}" ${d.settings.kinds.includes(k) ? "checked" : ""}> ${esc(label)}</label>`).join("")}</div>
      <div class="sub-h" style="font-size:14px">Desktop pop-ups</div>
      <p class="muted" style="margin:4px 0 0;font-size:12px">${desk || `<button type="button" class="btn small" data-act="desk-notify">Turn on pop-ups</button>`}</p>
      ${note ? `<div class="trim" style="color:var(--hp)">${esc(note)}</div>` : ""}${error ? `<div class="error">${esc(error)}</div>` : ""}
      <div class="foot"><button type="button" class="btn ghost" data-act="close">Close</button><button type="button" class="btn" data-act="test-alert">Send test</button><button class="btn gold" type="submit">Save</button></div>
    </form>`);
  const bell = $("#bell"); if (bell) bell.outerHTML = bellButton();
  $("#alerts-form").addEventListener("submit", async (ev) => { ev.preventDefault(); await saveAlertSettings(); });
}
async function saveAlertSettings(thenTest = false) {
  try {
    const topic = $("#ntfy").value.trim();
    if (topic) await api("/api/keys", { env_var: "NTFY_TOPIC", value: topic });
    const kinds = [...document.querySelectorAll("input[name=kind]:checked")].map((x) => x.value);
    await api("/api/settings", { alerts: { phone: $("#phone-on").checked, kinds } });
    await pollAlerts();

async function startBacktest() {

function pollLab() {
  clearInterval(S.labPoll);
  S.labPoll = setInterval(async () => {
    if (!S.lab) return clearInterval(S.labPoll);
    try { S.lab.data = await api("/api/backtests"); } catch { return; }
    const st = S.lab.data.status;
    if (st.state !== "running") {
      clearInterval(S.labPoll);
      if (st.state === "done" && st.result) { S.lab.run = await api(`/api/backtests/${encodeURIComponent(st.result.id)}`).catch(() => null); (st.result.excess_return_pct > 0 ? SFX.levelUp : SFX.loss)(); if (st.result.excess_return_pct > 0) burst(); }
    }
    if (!$("#layer").innerHTML && document.activeElement?.id !== "lab-stocks") renderLab();
  }, 1000);
}

// The payoff after a played day: the value counts up, damage numbers fly,
// trades blip, a bad day shakes the screen. Only right after a round.
function afterRound(f) {
  const before = S.before; S.before = null;
  if (!before || before.name !== f.name || before.session === f.last_session) return;
  const el = $("#hp-value"), diff = f.nav - before.nav;
  countUp(el, before.nav, f.nav);
  const fresh = f.log.filter((e) => e.at === f.last_session && e.kind === "trade");
  fresh.slice(0, 4).forEach((e, i) => setTimeout(() => (e.side === "buy" ? SFX.buy(i) : SFX.sell(i)), 120 * i));
  setTimeout(() => {
    if (Math.abs(diff) >= 0.5) floater(`${diff >= 0 ? "+" : "-"}${money(Math.abs(diff)).replace("-", "")}`, $("#hp-stat"), diff >= 0);
    if (diff >= 0) SFX.coin(); else SFX.loss();
    if (before.nav && diff / before.nav <= -0.015) shake($("#app"));
  }, 120 * Math.min(fresh.length, 4) + 100);
}

function partyPanel(f) {

  const tabs = f.universe.map((t) => `<button class="tab" role="tab" aria-selected="${t === S.ticker}" data-ticker="${esc(t)}">${esc(t)}</button>`).join("");
  const squads = f.spec.strategies.map((s) => {
    const heroes = s.analysts.map((a) => {
      const sig = view?.signals.find((x) => x.analyst === a.id && x.ticker === S.ticker && x.strategy === s.name);
      const stance = sig?.stance;
      const bars = sig && stance !== "abstain" ? Math.round((sig.confidence || 0) / 10) : 0;
      const words = !sig ? "No view yet. Play a day and I'll report in."
        : stance === "abstain" ? `zzz… no view: ${sig.reasoning.replace(/^abstained:\s*/, "")}`

      const mood = sig && stance !== "abstain" ? (sig.value > 0.5 ? "hot" : sig.value < -0.5 ? "cold" : "") : "";
      return `<article class="hero ${mood}">

          <div class="row">${sig ? `<span class="pill stance-${esc(stance)}">${esc(stance === "abstain" ? "no view" : stance)}</span>` : `<span class="pill faint">waiting</span>`}
            <span class="power" title="Confidence ${sig?.confidence ?? 0} of 100">${Array.from({ length: 10 }, (_, i) => `<i class="${i < bars ? "on" : ""}"></i>`).join("")}</span></div></div>
        <div class="bubble ${!sig || stance === "abstain" ? "quiet" : ""}">${esc(words)}</div></article>`;
    }).join("");

function nextPanel(f) {
  const plan = f.pending || (f.view && f.view.status === "executed" ? { as_of: f.view.as_of, targets: f.view.targets, clamps: f.view.clamps, done: true } : null);
  if (!plan) return `<header><h3>Next move</h3></header><div class="empty">No plan yet. The team decides on its first day.</div>`;
  const rows = Object.entries(plan.targets).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(([t, w]) => {
    const width = Math.min(50, Math.abs(w) * 50);
    const style = w >= 0 ? `left:50%;width:${width}%` : `right:50%;width:${width}%`;
    return `<div class="target"><span class="tk">${esc(t)}</span><div class="split"><i class="${w < 0 ? "short" : ""}" style="${style}"></i></div><span class="num ${cls(w)}" style="text-align:right">${pct(w, 0)}</span></div>`;
  }).join("") || `<div class="muted">Stay in cash.</div>`;
  const trims = (plan.clamps || []).map((c) => c.limit === "market_filter"
    ? `<div class="trim">Market shield is up: the S&amp;P 500 is below its long-term average, so only ${pct(c.after, 0)} is invested (wanted ${pct(c.before, 0)}).</div>`
    : c.limit === "pump_guard"
    ? `<div class="trim" style="color:var(--dmg)">Pump alarm: ${esc(c.ticker)} jumped on unusually heavy trading. The fund stays out of it until things settle (wanted ${pct(c.before, 0)}).</div>`
    : `<div class="trim">Risk officer trimmed ${esc(c.ticker || "the whole book")}: ${pct(c.before, 0)} → ${pct(c.after, 0)}</div>`).join("");
  return `<header><h3>Next move</h3><span class="label">${plan.done ? "last plan, done" : "waiting to execute"}</span></header>
    <p class="muted" style="margin:0 0 12px;font-size:12px">${plan.done ? `The plan from ${day(plan.as_of)}, already traded.` : `Target share of the fund for each stock, decided ${day(plan.as_of)}. It trades at the next day's closing price.`} Right of the line is owning, left is betting against.</p>
    <div class="targets">${rows}</div>${trims}`;
}

function logPanel(f) {
  if (!f.log.length) return `<div class="empty">Nothing has happened yet.</div>`;
  const line = (e) => {
    switch (e.kind) {
      case "trade": return [e.side, e.side === "buy" ? "Buy" : "Sell", `${e.side === "buy" ? "Bought" : "Sold"} ${e.quantity.toLocaleString()} ${esc(e.ticker)} @ ${money(e.price, true)} · ${money(e.value)}`];
      case "clamp": return e.limit === "market_filter"
        ? ["risk", "Shield", `Market below its long-term average: cut money invested from ${pct(e.before, 0)} to ${pct(e.after, 0)}`]
        : e.limit === "pump_guard"
        ? ["halt", "Pump", `Pump alarm on ${esc(e.ticker)}: sudden spike on heavy trading. Standing aside (wanted ${pct(e.before, 0)})`]
        : ["risk", "Risk", `Capped ${esc(e.ticker || "total exposure")} from ${pct(e.before, 0)} to ${pct(e.after, 0)}`];
      case "decision": return ["plan", "Plan", `New plan: ${Object.entries(e.targets).map(([t, w]) => `${esc(t)} ${pct(w, 0)}`).join(", ") || "all cash"}`];
      case "halt": return ["halt", "Frozen", esc(e.detail || "halted")];
      case "resume": return ["resume", "Resume", "Trading resumed"];
      case "tick_failed": return ["tick_failed", "Error", esc(e.detail)];
      case "redo": return ["redo", "Replay", `Replayed ${esc(e.detail)}`];
      default: return ["redo", esc(e.kind), esc(e.detail || "")];
    }
  };
  return `<div class="log">${f.log.map((e) => { const [k, tag, what] = line(e); return `<div class="entry ${S.freshDay && e.at === S.freshDay ? "fresh" : ""}"><span class="when">${day(e.at)}</span><span class="tag ${k}">${tag}</span><span class="what">${what}</span></div>`; }).join("")}</div>`;
}

/* ------------------------------------------------------------------ chart */
function drawChart(f, id = "chart") {
  const canvas = $("#" + id); if (!canvas) return;
  const box = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = box.width * dpr; canvas.height = box.height * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();
  const fund = f.series.map((p) => p.nav / f.capital * 100);
  const bench = f.series.map((p) => p.benchmark_close / f.series[0].benchmark_close * 100);
  const all = fund.concat(bench);
  let lo = Math.min(...all), hi = Math.max(...all);
  const step = niceStep((hi - lo) / 4 || 1);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const L = 44, R = 14, T = 12, B = 26, W = box.width - L - R, H = box.height - T - B;
  const X = (i) => L + (f.series.length === 1 ? W / 2 : (i / (f.series.length - 1)) * W);
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * H;
  g.font = `12px ${C("--display")}`; g.textBaseline = "middle";
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g.strokeStyle = v === 100 ? C("--faint") : "#2b2450"; g.lineWidth = v === 100 ? 2 : 1;
    g.setLineDash(v === 100 ? [4, 4] : []);
    g.beginPath(); g.moveTo(L, Math.round(Y(v)) + .5); g.lineTo(L + W, Math.round(Y(v)) + .5); g.stroke();
    g.fillStyle = C("--muted"); g.textAlign = "right"; g.fillText(v.toFixed(step < 1 ? 1 : 0), L - 8, Y(v));
  }
  g.setLineDash([]);
  g.fillStyle = C("--muted"); g.textBaseline = "alphabetic";
  g.textAlign = "left"; g.fillText(day(f.series[0].session), L, box.height - 6);
  g.textAlign = "right"; g.fillText(day(f.series.at(-1).session), L + W, box.height - 6);
  const line = (vals, color, width, dash) => {
    g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash); g.lineJoin = "miter";
    g.beginPath(); vals.forEach((v, i) => {
      const x = X(i), y = Y(v);
      if (i === 0) g.moveTo(x, y); else { g.lineTo(x, Y(vals[i - 1])); g.lineTo(x, y); } // stepped, like a pixel path
    }); g.stroke(); g.setLineDash([]);
  };
  // area under the fund line
  g.fillStyle = "rgba(255, 201, 60, .08)"; g.beginPath(); g.moveTo(X(0), Y(lo));
  fund.forEach((v, i) => { if (i) g.lineTo(X(i), Y(fund[i - 1])); g.lineTo(X(i), Y(v)); }); g.lineTo(X(fund.length - 1), Y(lo)); g.fill();
  line(bench, C("--mana"), 2, [6, 4]);
  line(fund, C("--gold"), 3, []);
  f.series.forEach((p, i) => { if (!p.traded) return; g.fillStyle = C("--ink"); const x = X(i), y = Y(fund[i]); g.fillRect(x - 3, y - 3, 6, 6); });
  const end = (vals, color) => { const x = X(vals.length - 1), y = Y(vals.at(-1)); g.fillStyle = color; g.fillRect(x - 5, y - 5, 10, 10); };
  end(bench, C("--mana")); end(fund, C("--gold"));
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

async function startRun(mode) {
  const name = S.fund.name;
  try { await api(`/api/funds/${encodeURIComponent(name)}/run`, { mode }); }
  catch (e) { return modal(`<h3>Couldn't start</h3><div class="error">${esc(e.message)}</div><div class="foot"><button class="btn ghost" data-act="close">Close</button></div>`); }
  const started = Date.now();
  S.pendingBefore = { name, nav: S.fund.nav, session: S.fund.last_session };
  const heroes = S.fund.spec.strategies.flatMap((s) => s.analysts).slice(0, 5);
  const show = () => modal(`<div class="thinking"><h3>Round in progress</h3>
    <div class="sprites">${heroes.map((a) => `<img alt="" src="${sprite(a.id, a.kind)}">`).join("")}</div>
    <p>The analysts are studying ${esc(S.fund.universe.join(", "))}…</p>
    <p class="muted num" style="font-size:20px">${Math.floor((Date.now() - started) / 1000)}s</p>
    <p class="faint" style="font-size:12px">You can leave this open. Closing the browser doesn't stop the round; closing the terminal window does.</p></div>`);
  show();
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    let job; try { job = await api(`/api/funds/${encodeURIComponent(name)}/run`); } catch { return; }
    if (job.state === "running") return show();
    clearInterval(S.poll); closeModal();
    if (job.state === "done") { S.before = S.pendingBefore; S.freshDay = job.session; }
    S.pendingBefore = null;
    await openFund(name);
    if (job.state === "done") toast(`Day ${day(job.session)} played · fund ${money(job.nav)}${job.decided ? " · new plan made" : ""}`);
    else if (job.state === "failed") SFX.error();
    else modal(`<h3>${job.state === "nothing_due" ? "No new day yet" : "Round stopped"}</h3><div class="${job.state === "nothing_due" ? "muted" : "error"}">${esc(job.message)}</div>

      <div class="foot"><button class="btn ghost" data-act="close">Close</button></div>`);
  }, 2000);
}

  { id: "d2", fund: "demo-fund", session: "2026-10-09", kind: "pump", label: "Pump alarm", level: "warn", ticker: "NVDA", title: "NVDA: pump alarm", body: "NVDA spiked on unusually heavy trading. demo-fund stays out of it for now." },
  { id: "d3", fund: "demo-fund", session: "2026-10-02", kind: "big_day", label: "Big day", level: "good", ticker: null, title: "demo-fund jumped 3.2% today", body: "Paper value $103,904 at the 2026-10-02 close." }];
let DEMO;
async function demoApi(path, body) {
  DEMO ||= demoData();
  if (path === "/api/state") return DEMO.state;
  if (path === "/api/alerts") return { alerts: DEMO_ALERTS, settings: { phone: false, kinds: Object.keys(KIND_LABELS) }, phone_ready: false };
  if (path === "/api/backtests") return { status: { state: "idle" }, runs: [] };
  if (body !== undefined) throw new Error("Demo mode: this is a preview with sample data. Run \"aihf web\" on your computer to play for real.");
  if (path.endsWith("/plan")) throw new Error("Demo mode: playing a day needs the app running on your computer (aihf web).");
  const name = decodeURIComponent(path.split("/")[3]);
  if (name === "demo-fund") return DEMO.fund;
  const s = DEMO.state.funds.find((f) => f.name === name);
  return { ...s, spec: DEMO.fund.spec, series: [], cash: s.nav, holdings: [], view: null, pending: null, log: [], run: { state: "idle" }, scorecard: null };
}

/* ------------------------------------------------------------------ boot */
(async function boot() {
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  try { if (!local) throw new Error("preview"); await refreshApp(); }
  catch { S.demo = true; await refreshApp(); }
  await pollAlerts();
  render();
  if (S.demo && !S.fund) await openFund("demo-fund");
})();
</script>
